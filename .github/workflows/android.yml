name: Android — build APKs

on:
  push:
    branches:
      - arena/caa2ca6a-hallyu-stream
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'mobile/**'
  workflow_dispatch:
    inputs:
      versionName:
        description: 'versionName for the build'
        required: false
        default: '1.0.0'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck & bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Metro production bundle
        run: |
          mkdir -p /tmp/bundle
          npx react-native bundle \
            --platform android --dev false --entry-file index.js \
            --bundle-output /tmp/bundle/index.android.bundle \
            --assets-dest /tmp/bundle/res
          ls -la /tmp/bundle/index.android.bundle

  build:
    name: Assemble APK
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      ANDROID_KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && '/tmp/hallyu-release.keystore' || '' }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Decode release keystore (optional)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/hallyu-release.keystore
          ls -l /tmp/hallyu-release.keystore

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug + release
        working-directory: mobile/android
        run: |
          ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName=${{ github.event.inputs.versionName || '1.0.0' }} \
            -PpairingBaseUrl=${{ vars.PAIRING_BASE_URL || 'http://10.0.2.2:8787' }}

      - name: Collect artefacts
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk            out/hallyu-stream-1.0.0-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk        out/hallyu-stream-1.0.0-release.apk
          ls -lh out

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hallyu-stream-debug-apk
          path: mobile/out/hallyu-stream-1.0.0-debug.apk
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: hallyu-stream-release-apk
          path: mobile/out/hallyu-stream-1.0.0-release.apk
          retention-days: 30
