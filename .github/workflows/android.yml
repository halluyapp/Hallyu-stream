name: Android APK

on:
  push:
    branches:
      - arena/caa2ca6a-hallyu-stream
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'mobile/**'
  workflow_dispatch:
    inputs:
      versionName:
        description: 'versionName for the build'
        required: false
        default: '1.0.0'

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble APKs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production Metro bundle
        run: |
          mkdir -p /tmp/bundle
          npx react-native bundle \
            --platform android --dev false --entry-file index.js \
            --bundle-output /tmp/bundle/index.android.bundle \
            --assets-dest /tmp/bundle/res

      # NOTE: secrets cannot be used in `if:` expressions (GitHub rejects the
      # whole workflow at parse time), so the presence check happens in shell.
      - name: Decode release keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret — release build will fall back to the debug key."
            exit 0
          fi
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/hallyu-release.keystore"
          {
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/hallyu-release.keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS"
            echo "ANDROID_KEY_ALIAS=$KS_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KS_KEYPASS"
          } >> "$GITHUB_ENV"
          echo "Release keystore decoded."

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug and release
        working-directory: mobile/android
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app:assembleDebug :app:assembleRelease \
            -PversionCode=${{ github.run_number }} \
            -PversionName=${{ github.event.inputs.versionName || '1.0.0' }}

      - name: Collect artefacts
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk     out/hallyu-stream-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk out/hallyu-stream-release.apk
          ls -lh out

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hallyu-stream-debug-apk
          path: mobile/out/hallyu-stream-debug.apk
          retention-days: 90

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: hallyu-stream-release-apk
          path: mobile/out/hallyu-stream-release.apk
          retention-days: 90

      # Publishes a downloadable APK on a rolling "apk-latest" release so the
      # file can be fetched straight from a phone without a GitHub login.
      - name: Publish rolling APK release
        if: github.event_name == 'push'
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest \
            mobile/out/hallyu-stream-debug.apk \
            mobile/out/hallyu-stream-release.apk \
            --title "HALLYU-STREAM · latest APK" \
            --notes "Built from ${GITHUB_SHA} on $(date -u +%Y-%m-%dT%H:%MZ).

          Install hallyu-stream-debug.apk on a phone or Android TV. The same file
          serves both: the app detects the form factor at launch.

          Release build is signed with the debug key unless ANDROID_KEY* secrets
          are configured." \
            --latest
