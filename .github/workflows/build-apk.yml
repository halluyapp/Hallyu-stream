name: Build Android APKs

'on':
  push:
    branches:
      - arena/69ba68a7-hallyu-stream
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'
  NODE_OPTIONS: '--max-old-space-size=4096'
  NPM_CONFIG_LEGACY_PEER_DEPS: 'true'
  GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false -Dorg.gradle.workers.max=2'

jobs:
  verify:
    name: Verify shared code + preview build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Strict TypeScript check
        run: npm run typecheck

      - name: Shared-layer smoke test
        run: npm run smoke

      - name: Build review harness
        run: npm run build:preview

      - uses: actions/upload-artifact@v4
        with:
          name: hallyu-stream-preview-dist-${{ github.sha }}
          path: apps/preview/dist
          if-no-files-found: warn
          retention-days: 14

  build-mobile-apk:
    name: Build phone APK (React Native / Expo)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || '' }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY || '' }}
      EXPO_PUBLIC_PAIRING_CLIENT_KEY: ${{ vars.EXPO_PUBLIC_PAIRING_CLIENT_KEY || '' }}
      EXPO_PUBLIC_ZAR_BASE_URL: ${{ vars.EXPO_PUBLIC_ZAR_BASE_URL || '' }}
      EXPO_PUBLIC_MOVIE_SEASON: ${{ vars.EXPO_PUBLIC_MOVIE_SEASON || '0' }}
      EXPO_PUBLIC_MOVIE_EPISODE: ${{ vars.EXPO_PUBLIC_MOVIE_EPISODE || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 platforms;android-35 build-tools;34.0.0 build-tools;35.0.0 ndk;26.1.10909125'
          accept-android-sdk-licenses: true

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Ensure Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" "ndk;26.1.10909125"

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix apps/mobile --no-audit --no-fund

      - name: Generate ephemeral CI signing key
        run: |
          KEYSTORE="$RUNNER_TEMP/hallyu-mobile-ci.keystore"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -alias hallyu \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass changeit -keypass changeit \
            -dname "CN=HALLYU-STREAM CI, OU=CI, O=Arena, L=Lagos, ST=Lagos, C=NG"
          {
            echo "HALLYU_SIGNING_STORE_FILE=$KEYSTORE"
            echo "HALLYU_SIGNING_STORE_PASSWORD=changeit"
            echo "HALLYU_SIGNING_KEY_ALIAS=hallyu"
            echo "HALLYU_SIGNING_KEY_PASSWORD=changeit"
          } >> "$GITHUB_ENV"

      - name: Generate native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean
        # CI=1 in the workflow env keeps prebuild non-interactive.

      - name: Align generated Gradle config with Expo SDK 52
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('apps/mobile/android')
          build = root / 'build.gradle'
          text = build.read_text()
          old = "classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')"
          new = "classpath('org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25')"
          assert old in text, 'Unexpected Expo template: Kotlin classpath line not found'
          build.write_text(text.replace(old, new))

          props = root / 'gradle.properties'
          gradle_props = props.read_text()
          gradle_props = gradle_props.replace(
              'org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m',
              'org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m',
          )
          for line in ('org.gradle.parallel=false', 'android.kotlinVersion=1.9.25'):
              if line not in gradle_props:
                  gradle_props += f'\n{line}\n'
          props.write_text(gradle_props)
          print('Patched Kotlin plugin to 1.9.25 and Gradle heap to 4g')
          PY

      - name: Build debug + release APKs
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$HALLYU_SIGNING_STORE_FILE" \
            -Pandroid.injected.signing.store.password="$HALLYU_SIGNING_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$HALLYU_SIGNING_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$HALLYU_SIGNING_KEY_PASSWORD" \
            --no-daemon --stacktrace

      - name: Collect phone APKs
        run: |
          mkdir -p artifacts/mobile
          find apps/mobile/android/app/build/outputs/apk -name 'app-debug.apk' -exec cp {} artifacts/mobile/hallyu-stream-phone-debug.apk \;
          find apps/mobile/android/app/build/outputs/apk -name 'app-release.apk' -exec cp {} artifacts/mobile/hallyu-stream-phone-release.apk \;
          test -f artifacts/mobile/hallyu-stream-phone-debug.apk
          test -f artifacts/mobile/hallyu-stream-phone-release.apk
          ls -lh artifacts/mobile

      - uses: actions/upload-artifact@v4
        with:
          name: hallyu-stream-mobile-apk-${{ github.sha }}
          path: artifacts/mobile/*.apk
          if-no-files-found: error
          retention-days: 14

  build-tv-apk:
    name: Build TV APK (react-native-tvos)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 platforms;android-35 build-tools;34.0.0 build-tools;35.0.0 ndk;26.1.10909125'
          accept-android-sdk-licenses: true

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Ensure Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" "ndk;26.1.10909125"

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix apps/tv --no-audit --no-fund

      - name: Write TV runtime config
        run: |
          cat > apps/tv/.env <<'EOF'
          SUPABASE_URL=${{ vars.SUPABASE_URL || vars.EXPO_PUBLIC_SUPABASE_URL || '' }}
          SUPABASE_PUBLISHABLE_KEY=${{ vars.SUPABASE_PUBLISHABLE_KEY || vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY || '' }}
          PAIRING_CLIENT_KEY=${{ vars.PAIRING_CLIENT_KEY || vars.EXPO_PUBLIC_PAIRING_CLIENT_KEY || '' }}
          ZAR_BASE_URL=${{ vars.ZAR_BASE_URL || vars.EXPO_PUBLIC_ZAR_BASE_URL || '' }}
          MOVIE_SEASON=${{ vars.MOVIE_SEASON || vars.EXPO_PUBLIC_MOVIE_SEASON || '0' }}
          MOVIE_EPISODE=${{ vars.MOVIE_EPISODE || vars.EXPO_PUBLIC_MOVIE_EPISODE || '0' }}
          EOF

      - name: Generate ephemeral CI signing key
        run: |
          KEYSTORE="$RUNNER_TEMP/hallyu-tv-ci.keystore"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -alias hallyu \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass changeit -keypass changeit \
            -dname "CN=HALLYU-STREAM CI, OU=CI, O=Arena, L=Lagos, ST=Lagos, C=NG"
          {
            echo "HALLYU_SIGNING_STORE_FILE=$KEYSTORE"
            echo "HALLYU_SIGNING_STORE_PASSWORD=changeit"
            echo "HALLYU_SIGNING_KEY_ALIAS=hallyu"
            echo "HALLYU_SIGNING_KEY_PASSWORD=changeit"
          } >> "$GITHUB_ENV"

      - name: Build debug + release APKs
        run: |
          gradle --project-dir apps/tv/android \
            assembleDebug assembleRelease \
            --no-daemon --stacktrace

      - name: Collect TV APKs
        run: |
          mkdir -p artifacts/tv
          find apps/tv/android/app/build/outputs/apk -name 'app-debug.apk' -exec cp {} artifacts/tv/hallyu-stream-tv-debug.apk \;
          find apps/tv/android/app/build/outputs/apk -name 'app-release.apk' -exec cp {} artifacts/tv/hallyu-stream-tv-release.apk \;
          test -f artifacts/tv/hallyu-stream-tv-debug.apk
          test -f artifacts/tv/hallyu-stream-tv-release.apk
          ls -lh artifacts/tv

      - uses: actions/upload-artifact@v4
        with:
          name: hallyu-stream-tv-apk-${{ github.sha }}
          path: artifacts/tv/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach APKs to tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-mobile-apk, build-tv-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hallyu-stream-*-apk-${{ github.sha }}
          merge-multiple: true
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: HALLYU-STREAM ${{ github.ref_name }}
          files: artifacts/**/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
